<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Summer Fridays Countdown</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .widget {
      text-align: center;
      background: #f8f7f4;
      border: 1px solid #e2e0d8;
      border-radius: 14px;
      padding: 24px 28px;
      width: 100%;
      max-width: 500px;
    }
    .eyebrow {
      font-size: 11px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: .09em;
      margin-bottom: 6px;
    }
    .event-title {
      font-size: 20px;
      font-weight: 500;
      color: #1a1a1a;
      margin-bottom: 20px;
    }
    .clock {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .unit {
      background: #fff;
      border: 1px solid #e2e0d8;
      border-radius: 10px;
      padding: 12px 16px;
      min-width: 72px;
    }
    .number {
      font-size: 34px;
      font-weight: 500;
      color: #1a1a1a;
      line-height: 1;
    }
    .label {
      font-size: 11px;
      color: #999;
      margin-top: 5px;
    }
    .sub {
      font-size: 12px;
      color: #bbb;
    }
    .done {
      font-size: 18px;
      font-weight: 500;
      color: #3a7d44;
      padding: 12px 0;
    }
  </style>
</head>
<body>
  <div class="widget">
    <p class="eyebrow">Counting down to</p>
    <p class="event-title">☀️ Summer Fridays</p>
    <div class="clock" id="clock">
      <div class="unit"><div class="number" id="days">--</div><div class="label">days</div></div>
      <div class="unit"><div class="number" id="hours">--</div><div class="label">hours</div></div>
      <div class="unit"><div class="number" id="mins">--</div><div class="label">minutes</div></div>
      <div class="unit"><div class="number" id="secs">--</div><div class="label">seconds</div></div>
    </div>
    <p class="sub">June 19, 2026 · Maple Systems</p>
  </div>

  <script>
    var target = new Date('2026-06-19T00:00:00');
    function pad(n) { return String(n).padStart(2, '0'); }
    function tick() {
      var diff = target - new Date();
      if (diff <= 0) {
        document.getElementById('clock').innerHTML = '<p class="done">Summer Fridays are here! 🎉</p>';
        return;
      }
      document.getElementById('days').textContent = Math.floor(diff / 86400000);
      document.getElementById('hours').textContent = pad(Math.floor(diff % 86400000 / 3600000));
      document.getElementById('mins').textContent = pad(Math.floor(diff % 3600000 / 60000));
      document.getElementById('secs').textContent = pad(Math.floor(diff % 60000 / 1000));
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
